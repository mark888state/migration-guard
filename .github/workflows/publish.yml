name: Publish to npm
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish package
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --access public
      - name: Explain missing npm credentials
        if: env.NODE_AUTH_TOKEN == ''
        run: echo '::warning::Set the NPM_TOKEN repository secret, then run this workflow again.'
